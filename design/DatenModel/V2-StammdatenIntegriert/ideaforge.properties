# =====================================================================
#  IdeaForge – Konfiguration für Werte, die nicht (mehr) als Tabelle in der DB liegen
#
#  Codes (ROLE, STAGE, Office-Code) sind der Schlüssel zur Datenbank:
#   * role.* und stage.*  müssen zu den ENUM-Typen user_role / idea_stage passen
#   * office.*            wird in app_user.office gespeichert (Format: A-Z, 0-9, _)
#  Texte sind frei änderbar, ohne die Datenbank anzufassen.
#  Für weitere Sprachen: ideaforge_de.properties mit denselben Schlüsseln.
# =====================================================================

# ---------------------------------------------------------------------
# Rollen   (DB: ENUM user_role, Spalte app_user.role)
# ---------------------------------------------------------------------
role.codes=STAFF,REVIEWER,ADMIN
role.default=STAFF

role.STAFF.label=Staff
role.STAFF.description=Submit, browse, vote on and comment on ideas
role.STAFF.permissions=idea.submit,idea.browse,idea.vote,idea.comment,dashboard.view

role.REVIEWER.label=Reviewer
role.REVIEWER.description=Innovation panel member: scores ideas and moves them through the stages
role.REVIEWER.permissions=idea.submit,idea.browse,idea.vote,idea.comment,dashboard.view,idea.score,idea.move_stage,panel.manage

role.ADMIN.label=Admin
role.ADMIN.description=Manages categories and reviewers, reports to leadership
role.ADMIN.permissions=idea.submit,idea.browse,idea.vote,idea.comment,dashboard.view,category.manage,idea.change_category,user.manage_roles,report.export

# ---------------------------------------------------------------------
# Pipeline-Stufen   (DB: ENUM idea_stage, Übergänge in is_valid_transition())
# Reihenfolge = Anzeige-Reihenfolge
# ---------------------------------------------------------------------
stage.codes=SUBMITTED,UNDER_REVIEW,PILOTING,IMPLEMENTED,DECLINED

stage.SUBMITTED.label=Submitted
stage.SUBMITTED.color=#6B7280
stage.UNDER_REVIEW.label=Under Review
stage.UNDER_REVIEW.color=#1B2A41
stage.PILOTING.label=Piloting
stage.PILOTING.color=#B9470C
stage.IMPLEMENTED.label=Implemented
stage.IMPLEMENTED.color=#15803D
stage.DECLINED.label=Declined
stage.DECLINED.color=#B91C1C

# Nur zur Anzeige im UI (welche Buttons ein Reviewer sieht).
# Verbindlich ist die Funktion is_valid_transition() in der Datenbank.
stage.SUBMITTED.next=UNDER_REVIEW,DECLINED
stage.UNDER_REVIEW.next=PILOTING,DECLINED
stage.PILOTING.next=IMPLEMENTED,DECLINED
stage.IMPLEMENTED.next=
stage.DECLINED.next=

# ---------------------------------------------------------------------
# Offices   (DB: app_user.office)  – BEISPIELWERTE, bitte durch echte Standorte ersetzen
# Codes nie umbenennen, solange Benutzer darauf verweisen; nur das Label ändern.
# ---------------------------------------------------------------------
office.codes=FRANKFURT,BERLIN,MUNICH,REMOTE

office.FRANKFURT.label=Frankfurt
office.BERLIN.label=Berlin
office.MUNICH.label=Munich
office.REMOTE.label=Remote

# ---------------------------------------------------------------------
# Innovation Panel
# ---------------------------------------------------------------------
panel.schedule=FIRST_TUESDAY_OF_MONTH
panel.status.PLANNED.label=Planned
panel.status.HELD.label=Held
panel.status.CANCELLED.label=Cancelled

# ---------------------------------------------------------------------
# Zweite Chance
# ---------------------------------------------------------------------
# Wird in der DB fest erzwungen (attempt_no IN (1,2)); hier nur für UI-Texte.
idea.max_attempts=2
